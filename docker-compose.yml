services:
  web:
    build:
      context: .
      target: web
    # 宿主端口可用环境变量 WEB_PORT 覆盖，默认 8080
    ports:
      - "${WEB_PORT:-8080}:4173"
    restart: unless-stopped

  # 一次性验收服务：构建并运行 Vitest 与 Playwright，结束即退出。
  # 用法：docker compose --profile verify run --rm verify
  verify:
    profiles: ["verify"]
    build:
      context: .
      target: verify
    # 不暴露端口：验收在容器内回环访问自带的静态服务
